# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["deploy"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # we do need a little build step to rearrange some files for out deployment
  build:
    runs-on: ubuntu-latest
    steps:
      
          
          
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Move files to deployment folder
        run : |
          set -x
          pwd
          ls
          mkdir deployment
          cp src/js9/js9.html deployment/index.html
          cp src/js9/js9.css deployment/
          cp src/js9/js9support.css deployment/
          cp src/js9/js9.min.js deployment/
          cp src/js9/js9support.min.js deployment/
          cp src/js9/js9plugins.js deployment/
          cp src/js9/astroem.js deployment/
          cp src/js9/astroemw.js deployment/
          cp src/js9/astroemw.wasm deployment/
          cp src/js9/images/js9-apple-touch-icon.png deployment/
          cp src/js9/favicon.ico deployment/
          cp src/js9/js9prefs.js deployment/
          ls deployment
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload deployment folder
          path: './deployment'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
